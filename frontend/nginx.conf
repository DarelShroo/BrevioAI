worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # mime.types maps only .js — not .mjs. pdf.js workers are .mjs; with
    # X-Content-Type-Options: nosniff the browser rejects octet-stream modules.
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Business plan video ceiling: 10 GiB per request body.
    client_max_body_size 10g;
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # HSTS is only meaningful behind TLS termination; enable when serving HTTPS.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Hashed Vite assets: never fall back to index.html (would break module workers).
        location /assets/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri /index.html;
        }

        location /api/ {
            # Explicit 10 GiB ceiling for uploads (inherits http-level too).
            client_max_body_size 10g;
            # Stream large bodies to FastAPI; do not buffer 10 GiB on nginx disk.
            proxy_request_buffering off;
            client_body_timeout 7200s;

            # Docker embedded DNS so "backend" re-resolves after recreates.
            # With variables, URI must be rewritten explicitly (proxy_pass
            # no longer strips the /api/ prefix automatically).
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $brevio_backend backend;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$brevio_backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }

        location = /404.html {
            root /usr/share/nginx/html;
        }
    }
}
