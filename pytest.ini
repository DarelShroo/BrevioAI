[pytest]
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    core/brevio/tests
    core/brevio_api/tests
norecursedirs =
    .git
    .venv
    venv
    node_modules
    data
    benchmark
    frontend
    __pycache__
    .mypy_cache
    .pytest_cache
    .pytest_basetemp
    .tmp
    dist
    build
cache_dir = core/brevio/tests/.pytest_cache
addopts = --import-mode=importlib -v
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    redis: requires a running Redis instance (opt-in via BREVIO_RUN_REDIS_TESTS=1)
