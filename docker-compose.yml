services:
  backend:
    build:
      context: ./core
      dockerfile: Dockerfile
    volumes:
      - ./core:/app/core
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - database
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - app_network

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    volumes:
      - db_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - app_network
    env_file:
      - .env

  redis:
    image: "redis:alpine"
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - app_network

  celery:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: celery -A core.brevio_api.celery worker --loglevel=debug --time-limit=7200 --soft-time-limit=3600
    volumes:
      - ./core:/app/core
      - ./data:/app/data
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge