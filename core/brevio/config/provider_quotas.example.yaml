# Provider quota policies (ADMIN-OWNED).
#
# Copy RPM/TPM from the provider console (AI Studio, OpenAI dashboard, etc).
# Do NOT treat example numbers as discovered Google quotas.
# max_in_flight is a Brevio operational burst cap, NOT a provider-discovered quota.
#
# quota_scope:
#   Prefer "gcp-project:YOUR_PROJECT_ID" when known.
#   Fallback "platform" or omit (resolver uses platform|cred:{id}).
#   Two API keys in the SAME Google project share Google's quota — map them
#   to the same gcp-project:X scope.
#
# quota_group:
#   Optional Redis bucket shared by several models of the same provider quota.
#   If omitted, the model name is the bucket.
#
# Circuit after HTTP 429:
#   Redis cooldown blocks every worker sharing the quota.
#   degraded_max_in_flight (default 1) is the half-open probe until a success.
#   There is no separate circuit-breaker library; cooldown + degraded inflight
#   + RPM is the global resume control.
#
# RPD is intentionally omitted (v2: Pacific midnight alignment).

version: 1
policies:
  - provider: google
    model: gemini-3.1-flash-lite
    # quota_scope: gcp-project:REPLACE_ME
    # quota_group: gemini-flash-lite
    # requests_per_minute: REPLACE_FROM_AI_STUDIO
    # tpm: REPLACE_FROM_AI_STUDIO
    # Free-tier RPD is tiny; serialize MAP/REDUCE to avoid burning the day quota.
    max_in_flight: 1
    lease_ttl_ms: 180000
    acquire_timeout_ms: 300000
    cooldown_on_429_seconds: 60
    rate_limit_safety_margin: 0.2
    degraded_max_in_flight: 1
    allow_map_original_text_fallback: false
    max_attempts: 3
    backoff_base_seconds: 2.0
    backoff_max_seconds: 60.0
    jitter_ratio: 0.25
