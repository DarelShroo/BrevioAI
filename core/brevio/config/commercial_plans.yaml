# Commercial plans — single source of truth for product limits.
# Spec values are mandatory; do not change them to make tests pass.
# Edit here — do not hardcode plan branches in application code.
# period_mode: calendar_month (UTC) | rolling_days
#
# list_price_* fields are marketing display amounts for the pricing page.
# They are NOT charged until a billing provider (e.g. Stripe) is wired and
# checkout_enabled becomes true. trial_days is null until a real trial exists.
#
# Byte sizes use MiB/GiB (1024-based) to match upload validators.
# rollover_max: hard cap after period grant (remaining + included).

period_mode: calendar_month
rolling_days: 30
# On plan change: keep period counters (documents/pages/bytes); new jobs use new plan limits.
plan_change_usage_policy: keep_period_counters

pricing:
  currency: EUR
  show_billing_toggle: true
  annual_discount_percent: 20
  sales_email: support@brevio.com
  highlighted_plan_id: pro

plans:
  - plan_id: free
    name: Free
    version: "1"
    status: active
    documents_per_period: 10
    pages_per_document: 200
    pages_per_period: 1000
    bytes_per_document: 26214400          # 25 MiB
    bytes_per_audio: 52428800             # 50 MiB
    bytes_per_video: 262144000            # 250 MiB
    # Period byte budget: docs_per_period × max(doc, audio, video)
    bytes_per_period: 2621440000          # 10 × 250 MiB
    credits_per_period: 100
    rollover_max: 200
    max_concurrent_jobs: 5
    scheduler_weight: 1
    scheduler_priority: 10
    byok_allowed: true
    brevio_funded_models:
      - qwen3:8b
      - qwen3:14b
      - qwen3:14b-q6
      - qwen3:32b
      - deepseek-r1:8b-llama-distill-q4_K_M
      - gpt-oss:20b
      - batiai/gemma4-31b:iq3
      - qwen3-vl-30b-a3b
    retention_days: 7
    media_enabled: true
    youtube_enabled: false
    list_price_monthly: 0
    cta_kind: start_free
    trial_days: null

  - plan_id: pro
    name: Pro
    version: "1"
    status: active
    documents_per_period: 100
    pages_per_document: 1000
    pages_per_period: 10000
    bytes_per_document: 104857600         # 100 MiB
    bytes_per_audio: 262144000            # 250 MiB
    bytes_per_video: 2147483648           # 2 GiB
    bytes_per_period: 214748364800        # 100 × 2 GiB
    credits_per_period: 4000
    rollover_max: 8000
    max_concurrent_jobs: 20
    scheduler_weight: 5
    scheduler_priority: 50
    byok_allowed: true
    brevio_funded_models:
      - qwen3:8b
      - qwen3:14b
      - qwen3:14b-q6
      - qwen3:32b
      - deepseek-r1:8b-llama-distill-q4_K_M
      - gpt-oss:20b
      - batiai/gemma4-31b:iq3
      - qwen3-vl-30b-a3b
      - gpt-4o-mini
      - gemini-3.1-flash-lite
    retention_days: 30
    media_enabled: true
    youtube_enabled: true
    list_price_monthly: 9.99
    cta_kind: choose_pro
    trial_days: null

  - plan_id: business
    name: Business
    version: "1"
    status: active
    documents_per_period: 500
    pages_per_document: 5000
    pages_per_period: 50000
    bytes_per_document: 524288000         # 500 MiB
    bytes_per_audio: 1073741824           # 1 GiB
    bytes_per_video: 10737418240          # 10 GiB
    bytes_per_period: 5368709120000       # 500 × 10 GiB
    credits_per_period: 20000
    rollover_max: 40000
    max_concurrent_jobs: 50
    scheduler_weight: 20
    scheduler_priority: 100
    byok_allowed: true
    brevio_funded_models: []  # empty = all catalog models may be Brevio-funded when not BYOK
    retention_days: 90
    media_enabled: true
    youtube_enabled: true
    list_price_monthly: 19.99
    cta_kind: contact_sales
    trial_days: null

default_plan_id: free
