repos:
  - repo: https://github.com/psf/black
    rev: 23.10.0
    hooks:
      - id: black
        name: Format with Black
        language_version: python3
        files: ^core/.*\.py$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.0
    hooks:
      - id: isort
        name: Sort imports with isort
        files: ^core/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: Type check with mypy
        # Manual until the codebase is cleaned for modern mypy on Python 3.14.
        # Commit gate is formatters + full backend/frontend test suites.
        stages: [manual]
        files: ^core/.*\.py$
        exclude: (^core/.*/tests/|^benchmarks/)
        additional_dependencies: []
        args: ["--ignore-missing-imports", "--follow-imports=skip"]

  - repo: local
    hooks:
      - id: pytest-backend
        name: Run backend pytest
        entry: bash -c 'PYTHONPATH=. .venv/bin/pytest --import-mode=importlib -v'
        language: system
        pass_filenames: false
        always_run: true

      - id: vitest-frontend
        name: Run frontend vitest
        entry: bash -c 'cd frontend && npm run test:unit -- --run'
        language: system
        pass_filenames: false
        always_run: true

      - id: playwright-frontend
        name: Run frontend playwright e2e
        entry: bash -c 'cd frontend && npm run test:e2e'
        language: system
        pass_filenames: false
        always_run: true

      - id: run-clear-cache
        name: Clear cache
        entry: scripts/clear_python_cache.sh
        args: ["./.."]
        language: script
        types: [python]
